name: CI Full Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ======================
      # 🦀 RUST
      # ======================
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          override: true

      - name: Build Rust
        run: cargo build --verbose

      - name: Lint Rust (Clippy)
        run: cargo clippy -- -D warnings

      - name: Test Rust
        run: cargo test

      # ======================
      # ⚙️ C++
      # ======================
      - name: Build C++
        run: g++ -Wall -Wextra -Werror -fsanitize=address -g test.cpp -o test_cpp

      - name: Run C++ binary
        run: ./test_cpp

      # ======================
      # ⚙️ C
      # ======================
      - name: Build C
        run: gcc -Wall -Wextra -Werror -fsanitize=address -g test.c -o test_c

      - name: Run C binary
        run: ./test_c

      # ======================
      # 🐹 GO
      # ======================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go
        run: go build ./...

      - name: Vet Go (static analysis)
        run: go vet ./...

      - name: Test Go
        run: go test ./...

      # ======================
      # 🐍 PYTHON
      # ======================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install -r requirements.txt || true
          pip install pytest pylint flake8 black

      - name: Lint Python
        run: |
          pylint **/*.py || true
          flake8 . || true
          black --check . || true

      - name: Test Python
        run: pytest || true
